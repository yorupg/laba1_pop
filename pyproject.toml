[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit"
version = "0.1.0"
description = "calculator and converter"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
    "typer>=0.27.2",
]

[tool.setuptools.packages.find]
where = ["src"]
